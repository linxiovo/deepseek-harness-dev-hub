name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    needs: windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          package_json_file: plugin/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check plugin
        run: pnpm check

  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          package_json_file: plugin/package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test handoff
        run: pnpm exec vitest run tests/handoff.spec.ts
      - name: Build
        run: pnpm build
